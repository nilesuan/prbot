# prbot Review (Fork) — story-6-5, story-7-4
#
# SECURITY: pull_request_target runs in base repo context.
# NO checkout of fork code — prevents code execution attacks.
#
# A4: every gate is a job-level condition. The previous version used
# `exit 0` inside a run: step, which ends that step successfully and lets
# the job continue, so an untrusted author still reached the credentialed,
# paid review path. A job-level `if:` is the only construct that stops the
# job before the OIDC role is assumed.
#
# A5: the image tag is resolved to an immutable digest once, that digest is
# verified against a signer identity pinned to this repository, and that same
# digest is what runs.
name: prbot Review (Fork)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: prbot-fork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRBOT_IMAGE: ghcr.io/nilesuan/prbot
  # No "v" prefix. The git tag is v0.2.0, but build.yml tags the image with
  # docker/metadata-action's type=semver,pattern={{version}}, which strips it.
  # Adding the v back here resolves to nothing and fails the digest step.
  PRBOT_IMAGE_TAG: 0.3.0

jobs:
  review:
    name: Fork PR Review
    runs-on: ubuntu-latest
    environment: fork-review
    # G-14 and NG-22: fork-only, open-only, and known-author-only. Evaluated
    # before any step runs, so a rejected PR never reaches OIDC or Bedrock.
    #
    # SEC-AUTH-02: an allowlist, not a blocklist. CommentAuthorAssociation
    # has eight members, and denying only FIRST_TIME_CONTRIBUTOR and NONE let
    # FIRST_TIMER (a brand-new account with no history anywhere) and
    # MANNEQUIN through a gate whose whole purpose is to keep untrusted
    # authors away from the OIDC role. Name the trusted associations instead,
    # so a value added to the enum later is denied by default.
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository
      && github.event.pull_request.state != 'closed'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.pull_request.author_association)
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1

      - name: Resolve image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect \
            "${PRBOT_IMAGE}:${PRBOT_IMAGE_TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "ref=${PRBOT_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify prbot image
        run: |
          cosign verify "${{ steps.image.outputs.ref }}" \
            --certificate-identity-regexp='^https://github\.com/nilesuan/prbot/\.github/workflows/' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'

      # NO actions/checkout — fork code is never checked out
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ vars.PRBOT_FORK_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PRBOT_AWS_REGION || 'ap-southeast-2' }}

      - name: Run prbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_API_URL \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -e PRBOT_PLATFORM=github \
            -e PRBOT_REPO="${{ github.repository }}" \
            -e PRBOT_PR_NUMBER="${{ github.event.pull_request.number }}" \
            -e PRBOT_AWS_REGION="${{ vars.PRBOT_AWS_REGION || 'ap-southeast-2' }}" \
            "${{ steps.image.outputs.ref }}"
