# prbot Review (Same-Repo) — story-6-5, story-7-4
#
# Exit codes:
#   0 — Review passed (APPROVE or COMMENT verdict)
#   1 — Review found blockers (REQUEST_CHANGES)
#   2 — Configuration error
#   3 — Infrastructure error
#
# Security: No untrusted user input in run: commands. All actions SHA-pinned
# (NG-15). A5: the image tag is resolved to an immutable digest once, that
# digest is verified with a signer identity pinned to this repository, and
# that same digest is what runs. `uses: docker://` cannot interpolate an
# expression, so the container is launched with an explicit `docker run`.
name: prbot Review (Same-Repo)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: prbot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRBOT_IMAGE: ghcr.io/nilesuan/prbot
  PRBOT_IMAGE_TAG: v0.2.0

jobs:
  review:
    name: PR Review
    runs-on: ubuntu-latest
    # Skip fork PRs — handled by prbot-fork.yml
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1

      - name: Resolve image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect \
            "${PRBOT_IMAGE}:${PRBOT_IMAGE_TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "ref=${PRBOT_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      # G-13: verification failure stops the job. The identity regexp is
      # pinned to this repository's workflows, not ".*".
      - name: Verify prbot image
        run: |
          cosign verify "${{ steps.image.outputs.ref }}" \
            --certificate-identity-regexp='^https://github\.com/nilesuan/prbot/\.github/workflows/' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ vars.PRBOT_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PRBOT_AWS_REGION || 'ap-southeast-2' }}

      # PRBOT_AWS_REGION is forwarded into the container: prbot reads its own
      # PRBOT_-prefixed variables and ignores AWS_REGION for configuration,
      # so setting only the action input left prbot on its built-in default.
      - name: Run prbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_API_URL \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -e PRBOT_PLATFORM=github \
            -e PRBOT_REPO="${{ github.repository }}" \
            -e PRBOT_PR_NUMBER="${{ github.event.pull_request.number }}" \
            -e PRBOT_AWS_REGION="${{ vars.PRBOT_AWS_REGION || 'ap-southeast-2' }}" \
            "${{ steps.image.outputs.ref }}"
